# Versions and releases with release-please (docs/deploy.md#releases), from the djazairdev project
# template.
#
# On every push to main, release-please reads the commits since the last release (the squashed
# pull request titles, in Conventional Commits form) and keeps one pull request open, "chore(main):
# release X.Y.Z", that sets the next version in version.txt and writes CHANGELOG.md. Merging that pull
# request tags vX.Y.Z and publishes the GitHub release; CI then deploys the tag and attaches the
# API's files to the release.
#
# release-please opens that pull request with GITHUB_TOKEN, as github-actions[bot], and GitHub holds
# the CI and title runs on a bot's pull request until a maintainer approves them in its merge box.
# Starting them here with workflow_dispatch wouldn't help: the ruleset still blocked the release
# pull request until its held runs were approved (template 1.5.3).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tags, releases, the release branch
      issues: write          # labels on the release pull request
      pull-requests: write   # the release pull request
      actions: write         # starts CI on the new tag
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag made with GITHUB_TOKEN starts no workflows, so start CI on the new tag: it tests,
      # builds and deploys the release, then attaches the built API and the tables to it.
      - name: Deploy the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$TAG"
