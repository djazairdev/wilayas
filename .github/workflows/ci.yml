# Tests, builds and deploys the API. A deploy runs only after every test and the build pass, so a
# failing change never replaces the last good version. Deploys also wait for the DEPLOY_ENABLED
# repository variable to be "true" (docs/deploy.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax
        run: python -m compileall -q build.py tools tests
      - name: Check the tables are up to date
        run: python tools/resolve.py --check
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build the API
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v7
        with:
          name: api
          path: dist
          include-hidden-files: true
          retention-days: 7

  # Deploys need the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the DEPLOY_ENABLED
  # variable (docs/deploy.md). Until all three are set, deploys are skipped.
  deploy-settings:
    name: Check deploy settings
    needs: build
    # main (pushed, or started by hand) deploys to production; pull requests from this
    # repository upload a preview; anything else only tests and builds.
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && [ "$ENABLED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: DEPLOY_ENABLED is not true, or the Cloudflare secrets are missing (see docs/deploy.md)."
          fi

  # The API is a Cloudflare Worker made only of static assets (wrangler.jsonc). main becomes the
  # live version; a pull request uploads a version that only its preview address serves.
  deploy:
    name: Deploy to Cloudflare
    needs: deploy-settings
    if: needs.deploy-settings.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7       # for wrangler.jsonc
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: api
          path: dist
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            ${{ github.event_name != 'pull_request' && 'deploy' || format('versions upload --preview-alias=pr-{0}', github.event.pull_request.number) }}
            --message=${{ github.sha }}
      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
